<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">AI Commerce Readiness</title>
  <desc id="desc">Card transparente do projeto de automação e validação da qualidade de anúncios com n8n, Node.js, JavaScript e APIs.</desc>
  <defs>
    <pattern id="aiGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#252b33" stroke-width="1" opacity=".72"/>
    </pattern>
  </defs>

  <!-- Canvas e interior transparentes. -->
  <rect x="2" y="2" width="756" height="386" rx="16" fill="none" stroke="#59616c" stroke-width="1.5"/>
  <path d="M410 236C502 82 648 80 738 152" fill="none" stroke="#59616c" stroke-width="1.2" stroke-dasharray="2 8" stroke-linecap="round" opacity=".42"/>

  <text x="42" y="72" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="32" font-weight="650">AI Commerce Readiness</text>
  <text x="42" y="113" fill="#a8afb9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20">Automação e qualidade de anúncios</text>

  <text x="42" y="182" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700">Validação de dados</text>
  <text x="42" y="218" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700">em fluxo automatizado</text>

  <path d="M42 294H718" stroke="#3d444d" stroke-width="1.4"/>
  <text x="42" y="342" fill="#a8afb9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18">n8n · Node.js · JavaScript · APIs</text>

  <path d="M422 36V270" stroke="#3d444d" stroke-width="1.4"/>
  <text x="452" y="55" fill="#7d8590" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.2">DATA / AUTOMATION</text>
  <rect x="701" y="45" width="7" height="7" transform="rotate(45 704.5 48.5)" fill="#f0f3f6"/>
  <rect x="716" y="45" width="7" height="7" transform="rotate(45 719.5 48.5)" fill="none" stroke="#7d8590"/>
  <rect x="446" y="72" width="282" height="180" fill="url(#aiGrid)"/>

