<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Distribuidora Alpha</title>
  <desc id="desc">Card transparente do projeto de modelagem relacional com dez tabelas, doze relacionamentos e trinta e oito consultas de negócio.</desc>
  <defs>
    <pattern id="alphaGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#252b33" stroke-width="1" opacity=".72"/>
    </pattern>
  </defs>

  <!-- Canvas e interior transparentes. -->
  <rect x="2" y="2" width="756" height="386" rx="16" fill="none" stroke="#59616c" stroke-width="1.5"/>
  <path d="M408 245C490 78 640 70 736 142" fill="none" stroke="#59616c" stroke-width="1.2" stroke-dasharray="2 8" stroke-linecap="round" opacity=".42"/>

  <text x="42" y="72" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="34" font-weight="650">Distribuidora Alpha</text>
  <text x="42" y="113" fill="#a8afb9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20">Modelagem relacional e consultas de negócio</text>

  <text x="42" y="182" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700">10 tabelas · 12 relacionamentos</text>
  <text x="42" y="218" fill="#f0f3f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700">38 consultas de negócio</text>

  <path d="M42 294H718" stroke="#3d444d" stroke-width="1.4"/>
  <text x="42" y="342" fill="#a8afb9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18">SQL · SQLite · Modelagem Relacional</text>

  <path d="M422 36V270" stroke="#3d444d" stroke-width="1.4"/>
  <text x="452" y="55" fill="#7d8590" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.2">DATA / MODEL</text>
  <rect x="701" y="45" width="7" height="7" transform="rotate(45 704.5 48.5)" fill="#f0f3f6"/>
  <rect x="716" y="45" width="7" height="7" transform="rotate(45 719.5 48.5)" fill="none" stroke="#7d8590"/>
  <rect x="446" y="72" width="282" height="180" fill="url(#alphaGrid)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#d2a65a" stroke-width="2.2">
      <path d="M565 135v-24h-58M625 135v-24h58M565 205v25h-58M625 205v25h58" stroke-dasharray="180" stroke-dashoffset="180">
        <animate attributeName="stroke-dashoffset" values="180;0;0" dur="4s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="595" cy="142" rx="38" ry="13" fill="#d2a65a" fill-opacity=".1"/>
      <path d="M557 142v58c0 8 17 13 38 13s38-5 38-13v-58M557 171c0 8 17 13 38 13s38-5 38-13"/>
    </g>
    <g stroke="#7895b2" stroke-width="2">
      <rect x="477" y="88" width="56" height="42" rx="6"/>
      <rect x="657" y="88" width="56" height="42" rx="6"/>
      <rect x="477" y="218" width="56" height="42" rx="6"/>
      <rect x="657" y="218" width="56" height="42" rx="6"/>
      <path d="M487 101h36M487 112h24M667 101h36M667 112h24M487 231h36M487 242h24M667 231h36M667 242h24"/>
    </g>
  </g>
  <g fill="#f0f3f6">
    <circle cx="565" cy="111" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="625" cy="111" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".7s" repeatCount="indefinite"/></circle>
    <circle cx="565" cy="230" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="625" cy="230" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
