<svg xmlns="http://www.w3.org/2000/svg" width="960" height="205" viewBox="0 0 960 205" role="img" aria-labelledby="title desc">
  <title id="title">Credit Risk Analytics: ETL e qualidade de dados</title>
  <desc id="desc">Card transparente e animado do projeto Credit Risk Analytics com gráfico de dispersão. Evidência: aproximadamente 150 mil registros na base de origem.</desc>
  <defs/>

  <!-- O canvas e o interior do card permanecem transparentes. -->
  <rect x="1" y="1" width="958" height="203" rx="12" fill="none" stroke="#59616c" stroke-width="1.5"/>
  <path d="M574 128C650 40 805 32 932 76" fill="none" stroke="#59616c" stroke-width="1.2" stroke-dasharray="2 8" stroke-linecap="round" opacity=".42"/>

  <text x="32" y="55" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="30" font-weight="650" fill="#f0f3f6">Credit Risk Analytics</text>
  <text x="32" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" fill="#a8afb9">ETL e qualidade de dados</text>
  <text x="32" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#f0f3f6">~150 mil registros na base de origem</text>
  <path d="M32 149H574" stroke="#3d444d" stroke-width="1.4"/>
  <text x="32" y="179" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" fill="#a8afb9">Excel · Power Query · Linguagem M · ETL</text>

  <path d="M602 22V183" stroke="#3d444d" stroke-width="1.4"/>
  <text x="628" y="35" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10" letter-spacing="1.2" fill="#7d8590">DATA / ANALYTICS</text>
  <rect x="909" y="28" width="7" height="7" transform="rotate(45 912.5 31.5)" fill="#f0f3f6"/>
  <rect x="924" y="28" width="7" height="7" transform="rotate(45 927.5 31.5)" fill="none" stroke="#7d8590"/>

  <g aria-label="Visualização analítica animada">
    <g stroke="#252b33" stroke-width="1" opacity=".8">
      <path d="M638 64H922M638 88H922M638 112H922M638 136H922"/>
      <path d="M666 52V142M714 52V142M762 52V142M810 52V142M858 52V142M906 52V142"/>
    </g>
    <path d="M638 142H922" stroke="#7d8590" stroke-width="1.2"/>
    <path d="M650 128L914 55" fill="none" stroke="#d7dce2" stroke-width="1.6" stroke-dasharray="5 5" opacity=".78">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="3s" repeatCount="indefinite"/>
    </path>
    <g fill="#a8afb9">
      <circle cx="662" cy="122" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".1s" repeatCount="indefinite"/></circle>
      <circle cx="684" cy="114" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="706" cy="119" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="724" cy="98" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".7s" repeatCount="indefinite"/></circle>
      <circle cx="748" cy="104" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin=".9s" repeatCount="indefinite"/></circle>
      <circle cx="770" cy="86" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="790" cy="92" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="812" cy="72" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="834" cy="82" r="3"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="854" cy="62" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="878" cy="68" r="5"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="902" cy="48" r="4"><animate attributeName="opacity" values=".35;1;.35" dur="2.8s" begin="2.3s" repeatCount="indefinite"/></circle>
    </g>
  </g>
