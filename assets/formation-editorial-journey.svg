<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title description">
  <title id="title">Formação, certificação e liderança</title>
  <desc id="description">Trajetória editorial monocromática com Bacharelado em Sistemas de Informação, Google Data Analytics Professional Certificate e Embaixadores Estudantis do Google 2026.</desc>

  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#30363d" stroke-width="1" opacity="0.18"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#d8dee4" opacity="0.92"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="810" fill="#05080b"/>
  <rect width="1200" height="810" fill="url(#grid)"/>

  <g fill="#f0f3f6" opacity="0.35">
    <circle cx="42" cy="48" r="1.2"/><circle cx="116" cy="32" r="1"/><circle cx="212" cy="58" r="1.4"/>
    <circle cx="348" cy="28" r="1"/><circle cx="486" cy="64" r="1.2"/><circle cx="632" cy="38" r="1"/>
    <circle cx="742" cy="72" r="1.4"/><circle cx="854" cy="34" r="1"/><circle cx="1004" cy="66" r="1.2"/>
    <circle cx="1144" cy="38" r="1.1"/><circle cx="72" cy="232" r="1"/><circle cx="288" cy="246" r="1.2"/>
    <circle cx="570" cy="220" r="1"/><circle cx="816" cy="250" r="1.1"/><circle cx="1160" cy="232" r="1.3"/>
    <circle cx="148" cy="376" r="1"/><circle cx="418" cy="334" r="1.1"/><circle cx="718" cy="396" r="1.4"/>
    <circle cx="1108" cy="356" r="1"/><circle cx="44" cy="514" r="1.2"/><circle cx="344" cy="502" r="1"/>
    <circle cx="642" cy="522" r="1.2"/><circle cx="904" cy="488" r="1"/><circle cx="1170" cy="526" r="1.3"/>
    <circle cx="122" cy="732" r="1"/><circle cx="460" cy="760" r="1.2"/><circle cx="704" cy="716" r="1"/>
    <circle cx="978" cy="764" r="1.3"/><circle cx="1150" cy="704" r="1"/>
  </g>

  <line x1="32" y1="270" x2="1168" y2="270" stroke="#6e7681" stroke-width="1" opacity="0.65"/>
  <line x1="32" y1="540" x2="1168" y2="540" stroke="#6e7681" stroke-width="1" opacity="0.65"/>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="34" y="166" fill="#8c959f" font-size="82" font-weight="300" opacity="0.62">01</text>
    <text x="162" y="88" fill="#d8dee4" font-size="16" font-weight="600" letter-spacing="7">FORMAÇÃO</text>
    <text x="162" y="135" fill="#f0f3f6" font-size="31" font-weight="600">Bacharelado em Sistemas de Informação — UNEX</text>
    <text x="162" y="178" fill="#b7c0c8" font-size="21">Quarto semestre</text>

    <text x="34" y="436" fill="#8c959f" font-size="82" font-weight="300" opacity="0.62">02</text>
    <text x="162" y="358" fill="#d8dee4" font-size="16" font-weight="600" letter-spacing="7">CERTIFICAÇÃO</text>
    <text x="162" y="405" fill="#f0f3f6" font-size="29" font-weight="600">Google Data Analytics Professional Certificate</text>
    <text x="162" y="448" fill="#b7c0c8" font-size="20">Google / Coursera · Concluído em outubro de 2026 · 9 cursos</text>

    <text x="34" y="706" fill="#8c959f" font-size="82" font-weight="300" opacity="0.62">03</text>
    <text x="162" y="628" fill="#d8dee4" font-size="16" font-weight="600" letter-spacing="7">LIDERANÇA</text>
    <text x="162" y="675" fill="#f0f3f6" font-size="30" font-weight="600">Embaixadores Estudantis do Google 2026</text>
    <text x="162" y="718" fill="#b7c0c8" font-size="20">Inteligência artificial · Liderança · Colaboração</text>
  </g>

  <!-- Formação: capelo em malha de dados -->
  <g stroke="#e6edf3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1008" cy="164" rx="142" ry="52" fill="none" stroke-width="1.4" stroke-dasharray="2 8" opacity="0.48"/>
    <path d="M890 111L1006 64l116 47-116 48z" fill="url(#dots)" stroke-width="2"/>
    <path d="M929 128v49c36 26 119 26 155 0v-49" fill="url(#dots)" stroke-width="2"/>
    <path d="M1122 111v58" fill="none" stroke-width="2"/>
    <circle cx="1122" cy="171" r="4" fill="#f0f3f6" filter="url(#glow)"/>
    <path d="M1122 175l-8 31h16z" fill="url(#dots)" stroke-width="1.5"/>
  </g>

  <!-- Certificação: certificado e gráfico analítico -->
  <g stroke="#e6edf3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1002" cy="430" rx="154" ry="54" stroke-width="1.3" stroke-dasharray="2 9" opacity="0.42"/>
    <g transform="rotate(-4 956 405)">
      <rect x="872" y="330" width="168" height="142" stroke-width="2" fill="#090d11"/>
      <path d="M894 360h118M894 382h94M894 404h108" stroke-width="1.5" opacity="0.72"/>
      <circle cx="984" cy="441" r="23" fill="url(#dots)" stroke-width="2"/>
      <path d="M972 441l9 9 17-20" stroke-width="2.5"/>
      <path d="M973 462l-8 26 19-9 16 13 4-30" stroke-width="1.6"/>
    </g>
    <path d="M1038 438l24-20 24 11 26-34 24 12 27-45" stroke-width="2"/>
    <path d="M1038 462h132M1062 462v-24M1086 462v-33M1112 462v-46M1137 462v-57M1163 462v-82" stroke="#8c959f" stroke-width="5" opacity="0.48"/>
    <g fill="#f0f3f6" stroke="none">
      <circle cx="1038" cy="438" r="3"/><circle cx="1062" cy="418" r="3"/><circle cx="1086" cy="429" r="3"/>
      <circle cx="1112" cy="395" r="3"/><circle cx="1136" cy="407" r="3"/><circle cx="1163" cy="362" r="3" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Liderança: rede humana e constelação de IA -->
  <g stroke="#e6edf3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1014" cy="706" rx="162" ry="54" stroke-width="1.3" stroke-dasharray="2 9" opacity="0.46"/>
    <g stroke-width="1.5" opacity="0.82">
      <path d="M952 601l45-23 45 16 42-28 44 20M952 601l90-7 86-8M997 578l17 57M1042 594l-28 41M1084 566l-31 69M1128 586l-75 49"/>
      <circle cx="952" cy="601" r="4" fill="#f0f3f6"/><circle cx="997" cy="578" r="4" fill="#f0f3f6"/>
      <circle cx="1042" cy="594" r="4" fill="#f0f3f6"/><circle cx="1084" cy="566" r="4" fill="#f0f3f6" filter="url(#glow)"/>
      <circle cx="1128" cy="586" r="4" fill="#f0f3f6"/><circle cx="1014" cy="635" r="4" fill="#f0f3f6"/>
      <circle cx="1053" cy="635" r="4" fill="#f0f3f6"/>
    </g>
    <g fill="url(#dots)" stroke-width="1.8">
      <circle cx="920" cy="688" r="22"/><path d="M883 750c5-33 20-48 37-48s32 15 37 48z"/>
      <circle cx="1014" cy="682" r="27"/><path d="M968 764c6-40 25-59 46-59s40 19 46 59z"/>
      <circle cx="1108" cy="688" r="22"/><path d="M1071 750c5-33 20-48 37-48s32 15 37 48z"/>
    </g>
  </g>
</svg>
