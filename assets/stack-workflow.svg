<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe do workflow da stack principal</title>
  <desc id="desc">Fluxo transparente e editorial com ferramentas de análise de dados, integração e automação.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22" stop-opacity=".96"/>
      <stop offset="1" stop-color="#080b0f" stop-opacity=".94"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#c7ced6"/>
    </marker>
    <pattern id="microdots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#d8dee4" opacity=".38"/>
    </pattern>
    <style>
      .stage{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2.2px;fill:#d8dee4}
      .tool{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#f0f3f6}
      .small{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1.4px;fill:#9da7b1}
      .line{fill:none;stroke:#aeb7c0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .dash{fill:none;stroke:#7d8792;stroke-width:1.2;stroke-dasharray:2 8;stroke-linecap:round}
      .junction{fill:#eef2f6;stroke:#0d1117;stroke-width:2}
      .node{fill:url(#card);stroke:#d8dee4;stroke-width:1.4}
      .cut{fill:none;stroke:#6e7781;stroke-width:1}
      .divider{stroke:#414a55;stroke-width:1}
    </style>
  </defs>

  <!-- transparent canvas: only sparse orbital details -->
  <path class="dash" opacity=".45" d="M285 138C490 42 828 54 1040 132s380 44 490-22"/>
  <path class="dash" opacity=".3" d="M192 235C436 315 840 272 1110 204s350-42 438 24"/>
  <g fill="#d8dee4" opacity=".42">
    <circle cx="310" cy="117" r="1.6"/><circle cx="480" cy="79" r="1.2"/><circle cx="750" cy="74" r="1.4"/>
    <circle cx="1018" cy="126" r="1.8"/><circle cx="1210" cy="178" r="1.3"/><circle cx="1470" cy="126" r="1.6"/>
  </g>

  <!-- stage labels -->
  <g>
    <path d="M62 24h122l10 10-10 24H62L52 48V34z" fill="#0d1117" stroke="#6e7781"/>
    <text class="stage" x="123" y="43" text-anchor="middle">FONTES</text>
    <path d="M344 24h162l10 10-10 24H344l-10-10V34z" fill="#0d1117" stroke="#6e7781"/>
    <text class="stage" x="425" y="43" text-anchor="middle">TRATAMENTO</text>
    <path d="M650 24h128l10 10-10 24H650l-10-10V34z" fill="#0d1117" stroke="#6e7781"/>
    <text class="stage" x="714" y="43" text-anchor="middle">MODELO</text>
    <path d="M956 24h128l10 10-10 24H956l-10-10V34z" fill="#0d1117" stroke="#6e7781"/>
    <text class="stage" x="1020" y="43" text-anchor="middle">MÉTRICAS</text>
    <path d="M1250 24h176l10 10-10 24h-176l-10-10V34z" fill="#0d1117" stroke="#6e7781"/>
    <text class="stage" x="1338" y="43" text-anchor="middle">VISUALIZAÇÃO</text>
  </g>

  <!-- top connections -->
  <path class="line" d="M258 103h28q18 0 18 18v19h28" marker-end="url(#arrow)"/>
  <path class="line" d="M258 203h28q18 0 18-18v-19h28" marker-end="url(#arrow)"/>
  <circle class="junction" cx="304" cy="153" r="4.8"/>
  <path class="line" d="M584 153h54" marker-end="url(#arrow)"/>
  <path class="line" d="M894 153h54" marker-end="url(#arrow)"/>
  <path class="line" d="M1144 153h86" marker-end="url(#arrow)"/>

  <!-- SQL node -->
  <g transform="translate(52 72)">
    <path class="node" d="M14 0h178l14 14v48l-14 14H14L0 62V14z"/>
    <path class="cut" d="M8 24V13l9-7h16M198 52v11l-9 7h-16"/>
    <ellipse cx="45" cy="25" rx="13" ry="6" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <path d="M32 25v24c0 8 26 8 26 0V25M32 37c0 8 26 8 26 0" fill="none" stroke="#c9d1d9" stroke-width="2"/>
    <line class="divider" x1="75" y1="18" x2="75" y2="58"/>
    <text class="tool" x="94" y="46">SQL</text>
  </g>

  <!-- Excel node -->
  <g transform="translate(52 172)">
    <path class="node" d="M14 0h178l14 14v48l-14 14H14L0 62V14z"/>
    <path class="cut" d="M8 24V13l9-7h16M198 52v11l-9 7h-16"/>
    <rect x="27" y="18" width="38" height="40" rx="4" fill="#217346"/>
    <path d="M43 27l6 11 7-11h7L53 43l10 15h-8l-7-11-7 11h-8l10-15-9-16z" fill="#fff"/>
    <line class="divider" x1="75" y1="18" x2="75" y2="58"/>
    <text class="tool" x="94" y="46">Excel</text>
  </g>

  <!-- Power Query -->
  <g transform="translate(338 115)">
    <path class="node" d="M14 0h218l14 14v48l-14 14H14L0 62V14z"/>
    <path class="cut" d="M8 24V13l9-7h16M238 52v11l-9 7h-16"/>
    <rect x="25" y="18" width="40" height="40" rx="6" fill="#00a6a6" opacity=".88"/>
    <g fill="#eaffff"><circle cx="35" cy="28" r="3"/><circle cx="45" cy="28" r="3"/><circle cx="55" cy="28" r="3"/><circle cx="35" cy="38" r="3"/><circle cx="45" cy="38" r="3"/><circle cx="55" cy="38" r="3"/><circle cx="35" cy="48" r="3"/><circle cx="45" cy="48" r="3"/></g>
    <path d="M52 47h14l-6-6m6 6l-6 6" fill="none" stroke="#eaffff" stroke-width="2"/>
    <line class="divider" x1="78" y1="18" x2="78" y2="58"/>
    <text class="tool" x="96" y="46">Power Query</text>
  </g>

  <!-- Modeling -->
  <g transform="translate(644 115)">
    <path class="node" d="M14 0h230l14 14v48l-14 14H14L0 62V14z"/>
    <path class="cut" d="M8 24V13l9-7h16M250 52v11l-9 7h-16"/>
    <path d="M27 27l20-11 20 11-20 11zm0 13l20 11 20-11m-40 13l20 11 20-11" fill="none" stroke="#d8dee4" stroke-width="2"/>
    <line class="divider" x1="80" y1="18" x2="80" y2="58"/>
    <text class="tool" x="98" y="34">Modelagem</text><text class="tool" x="98" y="56">de Dados</text>
  </g>

  <!-- DAX -->
  <g transform="translate(954 115)">
    <path class="node" d="M14 0h166l14 14v48l-14 14H14L0 62V14z"/>
    <path class="cut" d="M8 24V13l9-7h16M186 52v11l-9 7h-16"/>
    <text x="27" y="49" font-family="Georgia,serif" font-style="italic" font-size="34" fill="#eef2f6">ƒ(x)</text>
    <line class="divider" x1="94" y1="18" x2="94" y2="58"/>
    <text class="tool" x="112" y="46">DAX</text>
  </g>

  <!-- Power BI -->
  <g transform="translate(1236 115)">
    <path class="node" d="M14 0h244l14 14v48l-14 14H14L0 62V14z"/>
    <path class="cut" d="M8 24V13l9-7h16M264 52v11l-9 7h-16"/>
    <g fill="#f2c811"><rect x="28" y="39" width="8" height="19" rx="2"/><rect x="41" y="29" width="8" height="29" rx="2"/><rect x="54" y="17" width="8" height="41" rx="2"/></g>
    <line class="divider" x1="78" y1="18" x2="78" y2="58"/>
    <text class="tool" x="96" y="46">Power BI</text>
  </g>

  <!-- integration heading -->
  <g transform="translate(52 292)">
    <circle cx="18" cy="18" r="14" fill="none" stroke="#d8dee4" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="5" fill="none" stroke="#d8dee4" stroke-width="1.5"/>
    <path d="M18 0v7M18 29v7M0 18h7M29 18h7M5 5l5 5M26 26l5 5M31 5l-5 5M10 26l-5 5" stroke="#d8dee4" stroke-width="1.5"/>
    <text x="50" y="25" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="600" fill="#f0f3f6">INTEGRAÇÃO E AUTOMAÇÃO</text>
    <line x1="378" y1="18" x2="1480" y2="18" stroke="#414a55"/>
  </g>

  <!-- lower connections -->
  <path class="line" d="M264 398h58" marker-end="url(#arrow)"/>
  <path class="line" d="M534 398h58" marker-end="url(#arrow)"/>
  <path class="line" d="M804 398h58" marker-end="url(#arrow)"/>
  <path class="dash" d="M434 436v39q0 18 18 18h24"/>
  <path class="dash" d="M704 436v39q0 18 18 18h24"/>
  <circle class="junction" cx="434" cy="436" r="4.8"/><circle class="junction" cx="704" cy="436" r="4.8"/>

  <!-- API -->
  <g transform="translate(58 360)">
    <path class="node" d="M14 0h178l14 14v48l-14 14H14L0 62V14z"/>
    <path d="M43 23L27 38l16 15M61 23l16 15-16 15M56 18L48 58" fill="none" stroke="#61dafb" stroke-width="2.3"/>
    <line class="divider" x1="92" y1="18" x2="92" y2="58"/>
    <text class="tool" x="110" y="46">APIs</text>
  </g>

  <!-- n8n -->
  <g transform="translate(328 360)">
    <path class="node" d="M14 0h192l14 14v48l-14 14H14L0 62V14z"/>
    <g fill="none" stroke="#ff6d5a" stroke-width="3"><path d="M28 39h20l15-15 20 30 18-17"/><circle cx="28" cy="39" r="5"/><circle cx="48" cy="39" r="5"/><circle cx="63" cy="24" r="5"/><circle cx="83" cy="54" r="5"/><circle cx="101" cy="37" r="5"/></g>
    <line class="divider" x1="118" y1="18" x2="118" y2="58"/>
    <text class="tool" x="138" y="46">n8n</text>
  </g>

  <!-- Node -->
  <g transform="translate(598 360)">
    <path class="node" d="M14 0h192l14 14v48l-14 14H14L0 62V14z"/>
    <path d="M48 16l20 11v24L48 62 28 51V27z" fill="none" stroke="#5fa04e" stroke-width="3"/>
    <text x="38" y="47" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#5fa04e">JS</text>
    <line class="divider" x1="88" y1="18" x2="88" y2="58"/>
    <text class="tool" x="106" y="46">Node.js</text>
  </g>

  <!-- Supabase -->
  <g transform="translate(868 360)">
    <path class="node" d="M14 0h222l14 14v48l-14 14H14L0 62V14z"/>
    <path d="M49 15L27 43h20l-4 20 25-32H49z" fill="#3ecf8e"/>
    <line class="divider" x1="84" y1="18" x2="84" y2="58"/>
    <text class="tool" x="102" y="46">Supabase</text>
  </g>

  <!-- SQL Server support -->
  <g transform="translate(472 474)">
    <path class="node" d="M14 0h220l14 14v48l-14 14H14L0 62V14z"/>
    <path d="M29 25c17-10 31-9 43-3-17 2-25 10-28 17 10 2 20 7 28 15-18-4-31-2-43 4 8-12 9-21 0-33z" fill="none" stroke="#cc2927" stroke-width="2"/>
    <line class="divider" x1="88" y1="18" x2="88" y2="58"/>
    <text class="tool" x="106" y="46">SQL Server</text>
    <path d="M82 76h84l8 8-8 18H82l-8-8V84z" fill="#0d1117" stroke="#6e7781"/>
    <text class="small" x="124" y="94" text-anchor="middle">BANCO</text>
  </g>

  <!-- Git support -->
  <g transform="translate(742 474)">
    <path class="node" d="M14 0h188l14 14v48l-14 14H14L0 62V14z"/>
    <rect x="29" y="19" width="38" height="38" rx="5" transform="rotate(45 48 38)" fill="#f05032"/>
    <path d="M40 30l16 16M40 30v20m0-10h10" fill="none" stroke="#fff" stroke-width="2"/><circle cx="40" cy="30" r="3" fill="#fff"/><circle cx="40" cy="50" r="3" fill="#fff"/><circle cx="56" cy="46" r="3" fill="#fff"/>
    <line class="divider" x1="84" y1="18" x2="84" y2="58"/>
    <text class="tool" x="104" y="46">Git</text>
    <path d="M66 76h118l8 8-8 18H66l-8-8V84z" fill="#0d1117" stroke="#6e7781"/>
    <text class="small" x="125" y="94" text-anchor="middle">VERSIONAMENTO</text>
  </g>

  <!-- sparse lower orbit -->
  <path class="dash" opacity=".32" d="M1020 510c160 65 350 38 492-42"/>
  <g fill="url(#microdots)" opacity=".35"><circle cx="1310" cy="505" r="26"/><circle cx="1430" cy="468" r="18"/></g>
</svg>

