    <rect x="630" y="126" width="58" height="72" rx="10" stroke="#7fa68a" stroke-width="2"/>
    <circle cx="479" cy="145" r="5" stroke="#7895b2" stroke-width="2"/>
    <circle cx="465" cy="174" r="5" stroke="#7895b2" stroke-width="2"/>
