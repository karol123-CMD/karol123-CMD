<svg xmlns="http://www.w3.org/2000/svg" width="960" height="205" viewBox="0 0 960 205" role="img" aria-labelledby="title desc">
  <title id="title">AdventureWorks: Vendas, rentabilidade e concentração</title>
  <desc id="desc">Card transparente e animado do projeto AdventureWorks com gráfico de barras. Evidência: 5 páginas e 4.782 comparações SQL x DAX.</desc>
